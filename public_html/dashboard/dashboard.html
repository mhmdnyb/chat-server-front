<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash</title>
    <link rel="stylesheet" href="/src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dominant saira-condensed-semibold">
    <main>
      <!-- dashboard section -->
      <section class="w-screen h-screen flex justify-center items-center">
        <div
          class="bg-linear-to-bl from-white/25 to-white/15 backdrop-blur-2xl border border-white/40 shadow-xl px-4 py-2 rounded-xl"
        >
          <!-- imageChange sect -->
          <div class="rounded-full flex items-center justify-evenly">
            <img
              class="rounded-full outline-2 outline-black/30"
              src="/images/placeholder.webp"
              alt="profilePicture"
              width="100"
              height="100"
            />
            <input
              class="file:mx-4 file:mr-6 file:bg-thirtypercent file:py-1.5 file:px-3 file:rounded-full hover:file:opacity-90 file:transition-opacity"
              type="file"
              name="pfp"
              id="pfp"
              accept="image/jpeg, image/png, image/webp"
            />
          </div>
          <h2
            class="text-tenpercent text-shadow-sm text-shadow-black/20 text-center text-3xl saira-condensed-bold border-b border-b-black/50"
          >
            Your Account
          </h2>
        </div>
      </section>
    </main>
  </body>
  <script src="./dashboard.js" type="module"></script>
</html>
