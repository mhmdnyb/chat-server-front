<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <link rel="stylesheet" href="/src/output.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Saira Condensed", sans-serif;
      }
    </style>
  </head>

  <body
    class="bg-linear-to-br from-dominant to-[#2196F3] min-h-screen text-gray-800 antialiased flex justify-center items-center"
  >
    <main class="w-full px-4">
      <!-- passwordchange sect -->
      <section class="flex justify-center items-center">
        <form
          id="form"
          class="bg-white/20 backdrop-blur-xl border border-white/30 shadow-2xl p-8 rounded-3xl space-y-5 flex flex-col justify-center w-full max-w-sm"
        >
          <div class="text-center mb-4">
            <h2 class="text-3xl font-bold text-white tracking-wide">
              Security
            </h2>
            <p class="text-white/80 text-sm mt-1">Update your password</p>
          </div>

          <div class="space-y-4 w-full">
            <div class="relative">
              <input
                type="password"
                name="currentpw"
                id="currentpw"
                class="w-full bg-white/50 border border-white/40 text-gray-900 placeholder-gray-600 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-white/70 focus:bg-white/5 transition-all duration-300"
                placeholder="Current Password"
                required
              />
            </div>

            <div class="relative">
              <input
                type="password"
                name="newpw"
                id="newpw"
                class="w-full bg-white/50 border border-white/40 text-gray-900 placeholder-gray-600 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-white/70 focus:bg-white/5 transition-all duration-300"
                placeholder="New Password"
                required
              />
            </div>

            <div class="relative">
              <input
                type="password"
                name="confirmpw"
                id="confirmpw"
                class="w-full bg-white/50 border border-white/40 text-gray-900 placeholder-gray-600 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-white/70 focus:bg-white/5 transition-all duration-300"
                placeholder="Confirm Password"
                required
              />
            </div>
          </div>

          <button
            id="change"
            class="w-full bg-white/30 hover:bg-white/40 text-white font-semibold text-lg py-2.5 rounded-xl transition-all duration-300 shadow-sm hover:shadow-md border border-white/20 mt-2 cursor-pointer"
          >
            Update Password
          </button>
        </form>
      </section>
    </main>
  </body>
  <script src="./password.js"></script>
</html>
