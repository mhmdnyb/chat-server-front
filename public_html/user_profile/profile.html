<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This should be a modal</title>
    <link rel="stylesheet" href="/src/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dominant font-saira-condensed tracking-wider">
    <section class="h-screen w-screen flex items-center justify-center">
      <div
        class="bg-linear-to-br from-white/30 to-white/20 rounded-xl border border-white/60 backdrop-blur-2xl shadow-md shadow-black/30 py-3.5 px-3.5 space-y-1.5 relative"
      >
        <div
          class="absolute top-0 right-2.5 text-white/70 text-lg cursor-pointer"
          id="hideProfile"
        >
          x
        </div>
        <img
          class="rounded-full outline-2 outline-black/30 w-15 h-15 sm:w-25 sm:h-25 mx-auto"
          src="/images/placeholder.webp"
          width="100"
          height="100"
          alt="profilePicture"
        />
        <h2 class="text-center text-xl text-white/90" id="username">
          placeholder
        </h2>
        <div class="h-px w-sm bg-black"></div>
        <div class="grid grid-cols-2 mt-3">
          <h3>Member Since</h3>
          <h3 id="joinDate" class="place-self-end">15 Nov 2025</h3>

          <h3>Birthdate</h3>
          <h3 id="dob" class="place-self-end">15 Oct 2007</h3>
        </div>
        <div
          class="bg-[#404CAE] flex items-center justify-center gap-x-1.2 mx-auto text-white rounded-xl cursor-pointer"
        >
          <h3>Send Message</h3>
          <svg
            class="fill-white"
            width="30px"
            height="30px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <path
                d="M7 16H4V4H20V6M8 8H16M8 12H13M7 18.5V21L12 16H20V10"
                stroke="#001A72"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </g>
          </svg>
        </div>
      </div>
    </section>
  </body>
  <script src="./profile.js"></script>
</html>
